<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <title>Calendar</title>
</head>

<body>
    <div id="calendar"></div>
    <textarea id="text-area"></textarea>
    <button id="send-btn">Send</button>
    <div>
      <input type="radio" id="command-btn" name="api-select" value="command" checked>
      <label for="command-btn">Command</label>

      <input type="radio" id="agent-btn" name="api-select" value="agent">
      <label for="agent-btn">Agent</label>
    </div>
    <div id="pending"></div>

  <div id="agent-output"></div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
